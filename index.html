<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section combo-section hidden" id="combo-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section skins-selector">
          <span class="label">SKIN</span>
          <div class="skin-options">
            <button type="button" class="skin-option" data-skin="retro">Retro</button>
            <button type="button" class="skin-option" data-skin="neon">Neon</button>
            <button type="button" class="skin-option" data-skin="pastel">Pastel</button>
            <button type="button" class="skin-option" data-skin="pixel">Pixel</button>
          </div>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- SLOT-B2: name entry + top-5 list -->
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="pause-overlay-title">PAUSA</p>
        <!-- SLOT-A1: pause menu options -->
        <div class="pause-menu-options">
          <button id="resume-btn" class="menu-btn">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn menu-btn-secondary">Reiniciar</button>
          <button id="toggle-controls-btn" class="menu-btn menu-btn-secondary">Ver controles</button>
          <div id="pause-controls-list" class="controls hidden">
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
            </ul>
          </div>
          <div class="level-select-row">
            <label for="pause-level-select">Nivel inicial</label>
            <select id="pause-level-select"></select>
          </div>
        </div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>

        <div class="skins-selector start-skins">
          <span class="label">SKIN</span>
          <div class="skin-options">
            <button type="button" class="skin-option" data-skin="retro">Retro</button>
            <button type="button" class="skin-option" data-skin="neon">Neon</button>
            <button type="button" class="skin-option" data-skin="pastel">Pastel</button>
            <button type="button" class="skin-option" data-skin="pixel">Pixel</button>
          </div>
        </div>

        <!-- SLOT-B1: top-5 list + best combo / max lines -->

        <!-- SLOT-A2: starting-level selector -->
        <div class="level-select-row">
          <label for="start-level-select">Nivel inicial</label>
          <select id="start-level-select"></select>
        </div>

        <button id="start-btn">JUGAR</button>
      </div>
    </div>
  </div>

  <script src="hooks.js"></script>
  <script src="storage.js"></script>
  <script src="skins.js"></script>
  <script src="render.js"></script>
  <script src="core.js"></script>
  <script src="ui.js"></script>
  <script src="pausemenu.js"></script>
  <script src="highscores.js"></script>
</body>
</html>
